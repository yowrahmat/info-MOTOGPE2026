<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MOTOGPE FKIP ULM 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══════════════════════════════
       ANIMATED BACKGROUND (adapted)
    ══════════════════════════════ */
    .area {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(191,49,49,0.55) 0%, transparent 48%),
        radial-gradient(ellipse at 82% 82%, rgba(80,5,5,0.75) 0%, transparent 48%),
        linear-gradient(145deg, #3a0404 0%, #7D0A0A 38%, #BF3131 68%, #6b0808 100%);
    }

    .circles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      list-style: none;
    }

    .circles li {
      position: absolute;
      display: block;
      bottom: -180px;
      background: rgba(234, 209, 150, 0.12); /* gold tint */
      animation: floatUp 25s linear infinite;
    }

    /* Individual sizes, positions, delays — matching original proportions */
    .circles li:nth-child(1)  { left: 25%; width: 80px;  height: 80px;  animation-delay: 0s;   animation-duration: 25s; }
    .circles li:nth-child(2)  { left: 10%; width: 20px;  height: 20px;  animation-delay: 2s;   animation-duration: 12s; background: rgba(191,49,49,0.30); }
    .circles li:nth-child(3)  { left: 70%; width: 20px;  height: 20px;  animation-delay: 4s;   animation-duration: 25s; }
    .circles li:nth-child(4)  { left: 40%; width: 60px;  height: 60px;  animation-delay: 0s;   animation-duration: 18s; background: rgba(191,49,49,0.18); }
    .circles li:nth-child(5)  { left: 65%; width: 20px;  height: 20px;  animation-delay: 0s;   animation-duration: 25s; }
    .circles li:nth-child(6)  { left: 75%; width: 110px; height: 110px; animation-delay: 3s;   animation-duration: 25s; background: rgba(234,209,150,0.07); }
    .circles li:nth-child(7)  { left: 35%; width: 150px; height: 150px; animation-delay: 7s;   animation-duration: 28s; background: rgba(191,49,49,0.10); }
    .circles li:nth-child(8)  { left: 50%; width: 25px;  height: 25px;  animation-delay: 15s;  animation-duration: 45s; }
    .circles li:nth-child(9)  { left: 20%; width: 15px;  height: 15px;  animation-delay: 2s;   animation-duration: 35s; background: rgba(234,209,150,0.20); }
    .circles li:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s;   animation-duration: 11s; background: rgba(125,10,10,0.25); }
    /* Extra shapes for more depth */
    .circles li:nth-child(11) { left: 5%;  width: 45px;  height: 45px;  animation-delay: 8s;   animation-duration: 30s; background: rgba(234,209,150,0.09); }
    .circles li:nth-child(12) { left: 55%; width: 30px;  height: 30px;  animation-delay: 12s;  animation-duration: 20s; background: rgba(191,49,49,0.22); }

    @keyframes floatUp {
      0%   { transform: translateY(0)       rotate(0deg);   opacity: 1;    border-radius: 4px; }
      100% { transform: translateY(-110vh)  rotate(720deg); opacity: 0;    border-radius: 50%; }
    }

    /* Diamond grid overlay */
    .area::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        repeating-linear-gradient( 45deg, transparent 0, transparent 30px, rgba(234,209,150,0.028) 30px, rgba(234,209,150,0.028) 31px),
        repeating-linear-gradient(-45deg, transparent 0, transparent 30px, rgba(234,209,150,0.018) 30px, rgba(234,209,150,0.018) 31px);
    }

    /* Vignette */
    .area::after {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(25,0,0,0.65) 100%);
    }

    /* ══════════════════════════════
       PAGE LAYOUT
    ══════════════════════════════ */
    body {
      min-height: 100vh;
      font-family: 'Raleway', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 44px 16px 64px;
      position: relative;
      overflow-x: hidden;
    }

    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 500px;
      display: flex; flex-direction: column; align-items: center;
      animation: fadeUp 0.75s cubic-bezier(.22,.68,0,1.2) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(26px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════════
       LOGO
    ══════════════════════════════ */
     .logo-wrap {
      margin-bottom: 18px;
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .logo-wrap::before {
      content: '';
      position: absolute;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 206, 160, 0.22), transparent 70%);
      filter: blur(8px);
    }
    /* Replace the src below with your logo URL */
    .logo-wrap img {
      width: 90px; height: 90px;
      object-fit: contain;
      border-radius: 50%;
      position: relative;
      filter: drop-shadow(0 4px 18px rgba(0,0,0,0.35));
      transition: transform 0.4s ease;
    }
    .logo-wrap img:hover { transform: scale(1.07) rotate(-3deg); }

    /* If no image, show a placeholder circle */
    .logo-placeholder {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px dashed var(--card-border);
      display: flex; align-items: center; justify-content: center;
      color: var(--subtitle-color);
      font-size: 12px; text-align: center; padding: 8px;
      cursor: pointer;
    }

    /* ══════════════════════════════
       TITLE
    ══════════════════════════════ */
    .profile-name {
      font-family: 'Cinzel', serif;
      font-size: 1.12rem; font-weight: 700;
      color: #EAD196;
      letter-spacing: 0.10em; text-align: center;
      text-shadow: 0 2px 18px rgba(0,0,0,0.6), 0 0 40px rgba(234,209,150,0.12);
      margin-bottom: 5px;
    }
    .profile-tagline {
      font-size: 0.72rem; font-weight: 500;
      color: #e8c88a;
      letter-spacing: 0.16em; text-align: center;
      margin-bottom: 8px; text-transform: uppercase; opacity: 0.82;
    }
    .accent-line {
      width: 56px; height: 1px; margin-bottom: 24px;
      background: linear-gradient(90deg, transparent, #EAD196, transparent);
      opacity: 0.55;
    }

    /* ══════════════════════════════
       LINK BUTTONS
    ══════════════════════════════ */
    .links-section { width: 100%; display: flex; flex-direction: column; gap: 11px; }

    .link-btn {
      display: flex; align-items: center; gap: 14px;
      width: 100%; padding: 13px 18px;
      background: rgba(125,10,10,0.30);
      border: 1px solid rgba(234,209,150,0.22);
      border-radius: 12px;
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      text-decoration: none;
      transition: background .25s, border-color .25s, transform .2s, box-shadow .25s;
      box-shadow:
        0 2px 14px rgba(0,0,0,0.30),
        inset 0 1px 0 rgba(234,209,150,0.07),
        inset 0 -1px 0 rgba(0,0,0,0.12);
      animation: fadeUp .6s cubic-bezier(.22,.68,0,1.2) both;
      position: relative; overflow: hidden;
    }
    .link-btn::before {
      content: ''; position: absolute;
      top: 0; left: 12%; right: 12%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(234,209,150,0.28), transparent);
    }
    .link-btn:nth-child(1){animation-delay:.10s}
    .link-btn:nth-child(2){animation-delay:.18s}
    .link-btn:nth-child(3){animation-delay:.26s}
    .link-btn:nth-child(4){animation-delay:.34s}
    .link-btn:nth-child(5){animation-delay:.42s}

    .link-btn:hover {
      background: rgba(191,49,49,0.38);
      border-color: rgba(234,209,150,0.55);
      transform: translateY(-2px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.38), 0 0 20px rgba(234,209,150,0.05);
    }
    .link-btn:active { transform: translateY(0) scale(0.98); }

    .link-icon {
      flex-shrink: 0; width: 37px; height: 37px; border-radius: 8px;
      background: rgba(234,209,150,0.10);
      border: 1px solid rgba(234,209,150,0.18);
      display: flex; align-items: center; justify-content: center;
      color: #EAD196;
    }
    .link-icon svg { width: 17px; height: 17px; }

    .link-text { flex: 1; text-align: center; }
    .link-title {
      font-family: 'Cinzel', serif; font-size: .85rem; font-weight: 600;
      color: #EAD196; letter-spacing: .07em; display: block;
    }
    .link-sub {
      font-size: .69rem; color: #c9a46a;
      letter-spacing: .09em; display: block; margin-top: 2px;
    }
    .link-arrow {
      flex-shrink: 0; color: rgba(234,209,150,0.26);
      transition: color .2s, transform .2s;
    }
    .link-btn:hover .link-arrow { color: rgba(234,209,150,0.65); transform: translateX(3px); }

    /* ══════════════════════════════
       DIVIDER
    ══════════════════════════════ */
    .divider { width: 100%; display: flex; align-items: center; gap: 10px; margin: 4px 0; }
    .divider-line { flex: 1; height: 1px; background: rgba(234,209,150,0.22); }
    .divider-icon { color: rgba(234,209,150,0.22); }
    .divider-icon svg { width: 14px; height: 14px; display: block; }

    /* ══════════════════════════════
       FOOTER
    ══════════════════════════════ */
    .footer {
      margin-top: 28px; font-size: .67rem;
      color: rgba(234,209,150,0.35); text-align: center; letter-spacing: .07em;
    }

    @media(max-width:480px){
      body { padding: 30px 12px 52px; }
      .profile-name { font-size: 1rem; }
    }
  </style>
</head>
